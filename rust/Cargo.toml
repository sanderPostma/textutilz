[package]
name = "rust_lib_textutilz"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.103"
base64 = "0.22"
diesel = { version = "2.3.11", default-features = false, features = ["sqlite"] }
dirs = "6"
flate2 = "1"
flutter_rust_bridge = "=2.12.0"
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
percent-encoding = "2.3"
quoted_printable = "0.5"
rfd = "0.17.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
