[package]
name = "rust_lib_textutilz"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.103"
arboard = "3.4.1"
base64 = "0.22"
# `32-column-tables`: `documents` passed diesel's default 16-column ceiling when
# `language_override` was added. The feature only widens the generated tuple
# impls; it costs compile time, not runtime.
diesel = { version = "2.3.11", default-features = false, features = [
    "sqlite",
    "32-column-tables",
] }
dirs = "6"
flate2 = "1"
flutter_rust_bridge = "=2.12.0"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
percent-encoding = "2.3"
quoted_printable = "0.5"
regex = "1"
rfd = "0.17.2"
serde = "1.0.228"
serde_json = "1.0.150"
yaml-rust2 = "0.11"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
